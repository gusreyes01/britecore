[tool.pytest.ini_options]
testpaths = ["accounting"]
addopts = "--strict-markers --cov=accounting --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["accounting/test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
